name: Build tvOS App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Download crush.wasm
        run: |
          mkdir -p CinejoyNative/Resources
          curl -fsSL https://api.wing.st/crush.wasm -o CinejoyNative/Resources/crush.wasm
          echo "crush.wasm: $(wc -c < CinejoyNative/Resources/crush.wasm) bytes"

      - name: Generate placeholder app icon
        run: |
          mkdir -p "CinejoyNative/Assets.xcassets/App Icon.appiconset"
          python3 - <<'EOF'
          import struct, zlib
          def make_png(w, h, rgb):
              raw = b''
              for _ in range(h):
                  raw += b'\x00' + bytes(rgb) * w
              def chunk(typ, data):
                  c = typ + data
                  return struct.pack('>I', len(data)) + c + struct.pack('>I', zlib.crc32(c))
              sig = b'\x89PNG\r\n\x1a\n'
              ihdr = struct.pack('>IIBBBBB', w, h, 8, 2, 0, 0, 0)
              return sig + chunk(b'IHDR', ihdr) + chunk(b'IDAT', zlib.compress(raw, 9)) + chunk(b'IEND', b'')
          p = 'CinejoyNative/Assets.xcassets/App Icon.appiconset/icon-1280x768.png'
          open(p, 'wb').write(make_png(1280, 768, (26, 26, 34)))
          print('icon written:', p)
          EOF

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve Swift packages
        run: |
          xcodebuild -project CinejoyNative.xcodeproj \
            -scheme CinejoyNative \
            -resolvePackageDependencies

      - name: Build (unsigned) tvOS archive
        run: |
          set -o pipefail
          xcodebuild \
            -project CinejoyNative.xcodeproj \
            -scheme CinejoyNative \
            -configuration Release \
            -sdk appletvos \
            -destination 'generic/platform=tvOS' \
            -archivePath "$RUNNER_TEMP/CinejoyNative.xcarchive" \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""

      - name: Verify crush.wasm is bundled
        run: |
          APP_PATH=$(find "$RUNNER_TEMP/CinejoyNative.xcarchive/Products/Applications" -name "*.app" -maxdepth 1 | head -n 1)
          test -s "$APP_PATH/crush.wasm" || { echo "crush.wasm missing from app bundle"; ls "$APP_PATH"; exit 1; }
          echo "crush.wasm bundled: $(wc -c < "$APP_PATH/crush.wasm") bytes"

      - name: Package unsigned .ipa
        run: |
          APP_PATH=$(find "$RUNNER_TEMP/CinejoyNative.xcarchive/Products/Applications" -name "*.app" -maxdepth 1 | head -n 1)
          echo "Found app at: $APP_PATH"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/ipa/Payload/"
          cd "$RUNNER_TEMP/ipa"
          zip -r CinejoyNative.ipa Payload

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CinejoyNative-unsigned-ipa
          path: ${{ runner.temp }}/ipa/CinejoyNative.ipa
          retention-days: 30
