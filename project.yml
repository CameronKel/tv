name: CinejoyNative
options:
  bundleIdPrefix: com.yourname.cinejoynative
  deploymentTarget:
    tvOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"

targets:
  CinejoyNative:
    type: application
    platform: tvOS
    sources:
      - path: CinejoyNative
        excludes:
          - "Info.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yourname.cinejoynative
        INFOPLIST_FILE: CinejoyNative/Info.plist
        TARGETED_DEVICE_FAMILY: "3"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: "App Icon"
