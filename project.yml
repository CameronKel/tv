name: CinejoyNative
options:
  bundleIdPrefix: com.yourname.cinejoynative
  deploymentTarget:
    tvOS: "16.0"
    iOS: "16.0"
  createIntermediateGroups: true

packages:
  WasmKit:
    url: https://github.com/swiftwasm/WasmKit.git
    exactVersion: "0.0.8"

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"

targets:
  CinejoyNative:
    type: application
    platform: tvOS
    sources:
      - path: CinejoyNative
        excludes:
          - "Info.plist"
          - "Resources/crush.wasm"
      - path: CinejoyNative/Resources/crush.wasm
        buildPhase: resources
    dependencies:
      - package: WasmKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yourname.cinejoynative
        INFOPLIST_FILE: CinejoyNative/Info.plist
        TARGETED_DEVICE_FAMILY: "3"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: "App Icon & Top Shelf Image"
        SWIFT_OPTIMIZATION_LEVEL: "-O"

  # The iPad app: the same code (CinejoyNative/), with its own Info.plist and
  # icon. Platform differences live in Views/Components/Platform.swift and
  # `#if os(tvOS)` blocks.
  CinejoyPad:
    type: application
    platform: iOS
    sources:
      - path: CinejoyNative
        excludes:
          - "Info.plist"
          - "Resources/crush.wasm"
          - "Assets.xcassets"
      - path: CinejoyNative/Resources/crush.wasm
        buildPhase: resources
      - path: CinejoyPad
        excludes:
          - "Info.plist"
    dependencies:
      - package: WasmKit
    settings:
      base:
        PRODUCT_NAME: Cinejoy
        PRODUCT_BUNDLE_IDENTIFIER: com.yourname.cinejoynative.ipad
        INFOPLIST_FILE: CinejoyPad/Info.plist
        TARGETED_DEVICE_FAMILY: "2"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_OPTIMIZATION_LEVEL: "-O"

  CinejoyNativeUITests:
    type: bundle.ui-testing
    platform: tvOS
    sources:
      - path: CinejoyNativeUITests
    dependencies:
      - target: CinejoyNative
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yourname.cinejoynative.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: CinejoyNative

  CinejoyPadUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: CinejoyPadUITests
    dependencies:
      - target: CinejoyPad
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yourname.cinejoynative.ipad.uitests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "2"
        TEST_TARGET_NAME: CinejoyPad

schemes:
  CinejoyNative:
    build:
      targets:
        CinejoyNative: all
    test:
      targets:
        - CinejoyNativeUITests
  CinejoyPad:
    build:
      targets:
        CinejoyPad: all
    test:
      targets:
        - CinejoyPadUITests
